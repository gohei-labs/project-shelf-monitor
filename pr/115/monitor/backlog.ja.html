  <style>
    :root {
      --bg:#FBFBF8; --panel:#FFFFFF; --panel-soft:#F1F1EC;
      --ink:#0C0C0D; --muted:#6E6E70; --line:#E4E4DD; --line-strong:#C7C7BF;
      --accent:#BCE000; --accent-ink:#49590A;
      --red:#B84C42; --amber:#A67D3D; --blue:#5B7DB5; --green:#457B5B;
    }
    * { box-sizing:border-box; }
    html { scrollbar-gutter:stable; }
    html, body { margin:0; }
    body { background:var(--bg); color:var(--ink); font-family:"Inter", system-ui, sans-serif; line-height:1.55; -webkit-font-smoothing:antialiased; font-feature-settings:"tnum" 1; }
    main { max-width:1440px; margin:0 auto; padding:24px 18px 44px; }
    .topnav { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0 0 22px; }
    .topnav a { color:var(--muted); text-decoration:none; border:1px solid transparent; border-radius:8px; padding:7px 10px; font-size:.86rem; line-height:1; }
    .topnav a:hover { color:var(--ink); background:var(--panel); border-color:var(--line); }
    .topnav a.here { color:var(--ink); background:var(--panel); border-color:var(--line-strong); }
    .pagehead { border-bottom:1px solid var(--line); padding:0 0 18px; }
    .eyebrow { font-size:.72rem; letter-spacing:0; text-transform:uppercase; color:var(--muted); font-weight:700; margin:0; }
    .hero { font-family:"Space Grotesk", system-ui, sans-serif; font-weight:700; font-size:1.84rem; line-height:1.12; letter-spacing:-.01em; margin:6px 0 0; }
    .lead { color:var(--muted); font-size:.92rem; max-width:70ch; margin:10px 0 0; }
    .lead code { font-family:ui-monospace, SFMono-Regular, Consolas, monospace; font-size:.85em; background:var(--panel-soft); padding:1px 5px; border-radius:4px; }
    .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:18px 0 0; }
    .controls .lab { font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-right:2px; }
    .pill { font-family:"Space Grotesk", system-ui, sans-serif; font-weight:500; font-size:.82rem; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:999px; padding:6px 12px; cursor:pointer; display:inline-flex; gap:6px; align-items:center; }
    .pill:hover { border-color:var(--muted); }
    .pill .c { font-variant-numeric:tabular-nums; color:var(--muted); font-size:.78rem; }
    .pill[aria-pressed="true"] { background:var(--ink); color:var(--panel); border-color:var(--ink); }
    .pill[aria-pressed="true"] .c { color:var(--panel); opacity:.7; }
    .pill:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
    .layout { display:grid; grid-template-columns:minmax(0,1fr) 420px; gap:22px; align-items:start; margin:18px 0 0; }
    .deck { min-width:0; display:flex; flex-direction:column; gap:8px; }
    .bitem { position:relative; display:grid; grid-template-columns:64px auto 1fr; gap:12px; align-items:center; text-align:left; background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--imp,var(--line)); border-radius:8px; padding:12px 14px; cursor:pointer; color:var(--ink); font:inherit; width:100%; }
    .bitem.imp-P1 { --imp:var(--red); } .bitem.imp-P2 { --imp:var(--amber); } .bitem.imp-P3 { --imp:var(--blue); }
    .bitem:hover { background:var(--panel-soft); }
    .bitem:focus-visible { outline:2px solid var(--ink); outline-offset:-2px; }
    .bitem.active { background:var(--panel-soft); border-left-color:var(--imp); }
    .bid { font-family:ui-monospace, SFMono-Regular, Consolas, monospace; font-size:.78rem; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums; }
    .chips { display:flex; gap:5px; align-items:center; }
    .chip { font-family:"Space Grotesk", system-ui, sans-serif; font-weight:700; font-size:.68rem; letter-spacing:.03em; border-radius:5px; padding:3px 7px; white-space:nowrap; }
    .chip.imp { color:#fff; } .bitem.imp-P1 .chip.imp { background:var(--red); } .bitem.imp-P2 .chip.imp { background:var(--amber); } .bitem.imp-P3 .chip.imp { background:var(--blue); }
    .chip.type { background:var(--panel-soft); color:var(--ink); border:1px solid var(--line); }
    .chip.st-accepted { background:var(--green); color:#fff; }
    .btitle { font-weight:600; font-size:.92rem; line-height:1.4; color:var(--ink); overflow-wrap:anywhere; }
    .barea { font-family:ui-monospace, SFMono-Regular, Consolas, monospace; font-size:.74rem; color:var(--muted); margin-top:2px; }
    .detail { position:sticky; top:24px; max-height:calc(100vh - 48px); overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:20px; }
    .detail .mempty { color:var(--muted); font-size:.9rem; margin:0; }
    .detail dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:9px 14px; }
    .detail dt { font-family:"Space Grotesk", system-ui, sans-serif; font-weight:500; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); padding-top:2px; }
    .detail dd { margin:0; font-size:.9rem; color:var(--ink); line-height:1.55; overflow-wrap:anywhere; }
    .detail dd.mono, .detail dd .mono { font-family:ui-monospace, SFMono-Regular, Consolas, monospace; font-size:.82rem; }
    .detail .dh { font-family:"Space Grotesk", system-ui, sans-serif; font-weight:700; font-size:1.02rem; margin:0 0 4px; grid-column:1 / -1; }
    .detail .tagrow { display:flex; flex-wrap:wrap; gap:5px; }
    .detail .tag { font-family:ui-monospace, SFMono-Regular, Consolas, monospace; font-size:.74rem; background:var(--panel-soft); border:1px solid var(--line); border-radius:999px; padding:2px 8px; color:var(--muted); }
    .is-hidden { display:none !important; }
    @media (max-width:1000px) {
      .layout { grid-template-columns:1fr; }
      .detail { position:static; max-height:none; }
    }
    @media (max-width:760px) {
      main { padding:18px 12px 36px; }
      .topnav a { padding:7px 8px; font-size:.82rem; }
      .hero { font-size:1.36rem; }
      .bitem { grid-template-columns:1fr; gap:6px; }
    }
  </style>

    <div class="deck">
      <button type="button" class="bitem imp-P1" data-impact="P1" data-status="accepted" data-title="credentialDenyRead / pushRemoteAllowedPrefixes の空チェックのバックストップは、キーを丸ごと削除すると無効化される（@($null).Count は 0 ではなく 1）" data-impact-label="P1" data-type-label="バグ" data-status-label="採用" data-area="agent-policy" data-loc="scripts/guardrails/check-agent-policy.ps1:99" data-tags="fail-open,cwe-636,security" data-issue="PR #110" data-detail="99 行目と 102 行目は、SEC-01 の認証情報流出境界を `if (@($policy.credentialDenyRead).Count -eq 0)` と `if (@($policy.pushRemoteAllowedPrefixes).Count -eq 0)` で守っている。キーが policy.json から完全に欠落（ABSENT）している場合、ConvertFrom-Json はそのプロパティに対して $null を返し、PowerShell では `@($null).Count` は 0 ではなく 1（単一の $null 要素をラップした配列）になる。そのため `-eq 0` の判定は False となり、問題は一切記録されない。捕捉されるのは明示的な `&quot;credentialDenyRead&quot;: []`（Count 0）だけで、キーを削除するとすり抜けてしまう。もう一つのバックストップとされる build-agent-config.ps1 -Verify の同期チェック（62 行目）も役に立たない。これは同じ弱体化したポリシーから settings.json を再生成して比較するため、キーを削除したポリシーと再生成した settings.json は完全に「同期」した状態になり、verify は 0 で終了する。読み取り側の認証情報境界（aws/ssh/netrc の deny-read ルール）と送信側の push 許可リストの両方が、ゲートがグリーンのまま静かに消失する。（ジェネレーター自身がこれを助長する。credentialDenyRead が欠落していると、その `foreach ($c in @($policy.credentialDenyRead))` は $null に対して一度だけ実行され、無意味な空の `Read()` / `Read(/**)` ルールを出力するため、実際の認証情報パスは一切保護されない。）" data-proposal="null／欠落を明示的に判定する。例えば `if ($null -eq $policy.credentialDenyRead -or @($policy.credentialDenyRead).Count -eq 0)` とするか、プロパティが存在する非空の配列であることを要求する（`$policy.PSObject.Properties.Name -contains 'credentialDenyRead'` を確認する）。pushRemoteAllowedPrefixes にも同じ対応を適用する。build-agent-config.ps1 にある同一の `@($null)` が一度だけ実行されるループも、空の Read() ルールを出力しないように修正することを検討する。" data-evidence="3 名の懐疑者による敵対的検証（fail-open 監査）で確認済み。" data-source="fail-open-audit-2026-07-10" data-raised="2026-07-10">
        <span class="bid">BL-001</span>
        <span class="chips"><span class="chip imp">P1</span><span class="chip type">バグ</span><span class="chip st-accepted">採用</span></span>
        <span><span class="btitle">credentialDenyRead / pushRemoteAllowedPrefixes の空チェックのバックストップは、キーを丸ごと削除すると無効化される（@($null).Count は 0 ではなく 1）</span><span class="barea">agent-policy</span></span>
      </button>
      <button type="button" class="bitem imp-P1" data-impact="P1" data-status="candidate" data-title="両方のレコード（contract + architecture）で型を付け替えられたコンポーネントは、すべてのチェック適用から静かに抜け出す。型のクロスチェックは不一致のときにしか発火しない" data-impact-label="P1" data-type-label="バグ" data-status-label="候補" data-area="application-monitor" data-loc="scripts/guardrails/check-application-monitor.ps1:127" data-tags="fail-open,cwe-636" data-issue="" data-detail="backend-checks は唯一配線された component-check の呼び出しであり、type=backend にスコープされ（scripts/check.ps1:96）、ComponentType でフィルタされる（check-component-checks.ps1:130）。check-component-contract.ps1:143 は 'worker'、'library'、'tooling'、'other' を有効な型として受け入れるが、そのいずれにも配線されたゲートが存在しない。静かな型付け替えを捕捉するはずなのは check-application-monitor.ps1:124-130 だが、そのガードは architectureType -ne contractType のときにしか問題を追加しない（line 127）。攻撃者が backend コンポーネントを project-components.json と product/application-monitor.json の両方で 'worker' に付け替えると、2つのレコードは一致するため、不一致ガードは決して発火しない。component-contract は 'worker' を受け入れ、backend-checks はスコープ内に何も見つけず 0 で終了する（'No declared components in scope; nothing to run'）。そして worker/library/tooling/other 向けのゲートは存在しない。宣言された commands.check（uv run ruff check &amp;&amp; uv run pytest）は決して実行されず、その結果、壊れた／バックドアを仕込まれた backend コードが、すべてのゲートを緑にしたままマージされる。単一ファイルのみの型付け替えは捕捉されるため、型付け替えがカバーされているという誤った安心感を与えてしまう。" data-proposal="レコードの一致だけに依存してはならない。型が 'checkable' な型（backend、および将来のあらゆる stack 型）である宣言／architecture の実装コンポーネントのすべてが、実際に配線された check 呼び出しによって受け持たれていることを表明するゲートを追加する。すなわち、宣言されたコンポーネントの型に適用ゲートが存在しない場合、あるいは以前 backend だったコンポーネントのパスの型が少しでも変わった場合に失敗させる。あるいは、同一 PR が書き換え可能な自由形式の 'type' ではなく、静かに狭められないもの（例: stack/check コマンドの有無）に backend-checks のスコープを結び付ける。" data-evidence="3人の懐疑者による敵対的検証（fail-open 監査）で確認済み。" data-source="fail-open-audit-2026-07-10" data-raised="2026-07-10">
        <span class="bid">BL-002</span>
        <span class="chips"><span class="chip imp">P1</span><span class="chip type">バグ</span></span>
        <span><span class="btitle">両方のレコード（contract + architecture）で型を付け替えられたコンポーネントは、すべてのチェック適用から静かに抜け出す。型のクロスチェックは不一致のときにしか発火しない</span><span class="barea">application-monitor</span></span>
      </button>
      <button type="button" class="bitem imp-P1" data-impact="P1" data-status="candidate" data-title="日本語ツリーの「未翻訳コピー」チェックは割合を考慮しない：形式だけの日本語ヘッダーがあると、本文が完全に英語でも除外されてしまう" data-impact-label="P1" data-type-label="バグ" data-status-label="候補" data-area="doc-language-content" data-loc="scripts/guardrails/check-doc-language-content.ps1:65" data-tags="fail-open,cwe-636" data-issue="" data-detail="日本語ツリーのゲートは `$ascii -ge $JapaneseTreeAsciiFloor -AND $jp -lt $MinJapaneseTreeJapaneseChars`（ascii&gt;=120 AND jp&lt;8）が成立するときにのみファイルをフラグする。両方のオペランドは割合ではなく絶対数である。docs/ja 配下のファイルは、日本語文字を少なくとも8文字含んでいる（jp&gt;=8）だけで、未翻訳の英語をどれだけ含んでいても無条件に除外される。連言の `$jp -lt 8` オペランドが false になるためだ。このルールがブロックすると約束している当の失敗モード——翻訳者が部分的にしか手を入れていない、docs/ja 配下に残された英語コピー（タイトルだけ翻訳し、日本語の H1 や frontmatter だけ残して、本文は英語のまま）——がそのまますり抜けてしまう。どのしきい値を設定してもこれは塞げない。MinJapaneseTreeJapaneseChars を上げても除外される帯域が広がるだけであり、チェックは日本語と英語の割合を一切比較しないため、レジストリルール DOC-03 が定める性質——「各言語ツリーが実際にその言語を含み、未翻訳のコピーが残されていないこと」——ではなく、形式（「何らかの日本語が存在する」）を検証しているにすぎない。" data-proposal="日本語ツリーは絶対的な下限値ではなく割合で判定すべきだ。たとえば `ascii&gt;=120 AND jp&lt;8` の連言に代えて、ファイルの総コンテンツ量が十分になった時点で、英字が日本語文字を一定の比率で上回る場合（ascii / max(jp,1) がある上限を超える場合）にフラグする。53 行目の英語ツリーのチェックにも鏡像の盲点があり（絶対的な日本語文字数しか数えないため、docs/en 配下で日本語文字が40文字未満の短い日本語のみのファイルもすり抜ける）、同様に割合を考慮する扱いを与えるべきだ。" data-evidence="3名の懐疑者による敵対的検証（フェイルオープン監査）で確認済み。" data-source="fail-open-audit-2026-07-10" data-raised="2026-07-10">
        <span class="bid">BL-003</span>
        <span class="chips"><span class="chip imp">P1</span><span class="chip type">バグ</span></span>
        <span><span class="btitle">日本語ツリーの「未翻訳コピー」チェックは割合を考慮しない：形式だけの日本語ヘッダーがあると、本文が完全に英語でも除外されてしまう</span><span class="barea">doc-language-content</span></span>
      </button>
      <button type="button" class="bitem imp-P1" data-impact="P1" data-status="candidate" data-title="認証情報マウントのチェックは固定の denylist であり、.git-credentials や .docker-config などを見落とすため、ゲートが &quot;no credential mounts&quot; と報告していてもホストの認証情報をバインドマウントできてしまう" data-impact-label="P1" data-type-label="バグ" data-status-label="候補" data-area="sandbox-config" data-loc="scripts/guardrails/check-sandbox-config.ps1:75" data-tags="fail-open,cwe-636,security" data-issue="" data-detail="Check 6 は compose.yaml をリテラル断片 @(&quot;.ssh&quot;, &quot;.aws&quot;, &quot;.netrc&quot;, &quot;.config/gh&quot;, &quot;.config\\gh&quot;) についてのみ走査し（line 75）、それら完全一致の部分文字列のいずれかが現れたときにだけ problem を追加する（lines 76-80）。そのリストに載っていない認証情報パスは一切検知されない。レジストリルール（ENV-01）は &quot;host credentials are never mounted&quot; を約束し、line 125 の成功メッセージは &quot;no credential mounts&quot; と断言しているが、このチェックが検証しているのは特定の5つの文字列が存在しないことだけであり、認証情報がマウントされていないことではない。とりわけ ~/.git-credentials（git push トークン。本リポジトリ自身の credential-exfiltration-boundary ルールが名指しする、まさに主要な持ち出し標的）、~/.docker/config.json（レジストリ認証）、~/.kube/config、~/.gnupg、~/.npmrc、~/.pypirc を見落とす。" data-proposal="禁止する断片を列挙してはならない。代わりに workspace サービスの volumes をパースし、唯一の想定される source である . -&gt; /workspace のみを allowlist する方式にしたうえで、いずれかの bind source がホストのホームディレクトリ配下（またはリポジトリの作業ツリー外）に解決される場合に失敗させること。許可されたマウントの allowlist は fail closed になるが、認証情報名の denylist ではそうはできない。" data-evidence="3-skeptic の敵対的検証（fail-open 監査）により確認済み。" data-source="fail-open-audit-2026-07-10" data-raised="2026-07-10">
        <span class="bid">BL-004</span>
        <span class="chips"><span class="chip imp">P1</span><span class="chip type">バグ</span></span>
        <span><span class="btitle">認証情報マウントのチェックは固定の denylist であり、.git-credentials や .docker-config などを見落とすため、ゲートが &quot;no credential mounts&quot; と報告していてもホストの認証情報をバインドマウントできてしまう</span><span class="barea">sandbox-config</span></span>
      </button>
      <button type="button" class="bitem imp-P1" data-impact="P1" data-status="candidate" data-title="UTF-16/UTF-32 でエンコードされた変更ファイルがシークレットスキャナーをすり抜ける（Latin-1 バイトデコード + NUL 挿入による正規表現の取りこぼし）" data-impact-label="P1" data-type-label="バグ" data-status-label="候補" data-area="secret-leak" data-loc="scripts/guardrails/check-secret-leak.ps1:93" data-tags="fail-open,cwe-636,security" data-issue="" data-detail="34 行目はデコーダーを Latin-1（Encoding 28591、1 バイト -&gt; 1 コードポイント）に固定し、93 行目は $latin1.GetString($bytes) を Scan-Text に渡している。すべてのパターン（例: GitHub トークンの '(?&lt;![A-Za-z0-9])gh[opusr]_[A-Za-z0-9]{36,}'）は、トークン文字が連続して並んでいることを要求する。変更ファイルが UTF-16 で保存されている場合、各 ASCII 文字は 0x67 0x00 のようなバイト対になるため、Latin-1 でデコードすると 'g&lt;NUL&gt;h&lt;NUL&gt;p&lt;NUL&gt;_...'、すなわちすべての文字の間に NUL バイトが挟まった文字列が得られる。連続並びを前提とする正規表現は決してマッチせず、Scan-Text は検出を一切追加せず、ファイルは通過してしまう。ゲートはファイルを「検査した」ものの、スキャン可能なものを何も見ないまま 0 で終了する。スクリプト自身のヘッダーコメントは、バイト内容のスキャンによってファイルが「シークレットを隠せない」と主張しているが、UTF-16 はまさにその主張を打ち破る。これは任意の変更ファイルを単独で担当するゲートであり（拡張子フィルターを一切適用しない）、text-encoding ガードレールは固定された許可リストのテキスト拡張子しかスキャンしないため、リストにない拡張子（例: .dat）に含まれる UTF-16 のシークレットはスイート全体をすり抜ける。" data-proposal="すべてのバイトを Latin-1 としてデコードしないこと。BOM（UTF-16 LE/BE、UTF-32）や NUL バイトの密度でエンコーディングを検出し、加えて NUL バイトを取り除いた Latin-1 コピーもスキャンする（または複数のデコード結果をスキャンする）ことで、同じトークンの NUL 挿入表現でも正規表現に対して連続した並びを提示できるようにする。あるいは、マッチング前に 0x00 バイトを除去して正規化する。" data-evidence="3 名の懐疑者による敵対的検証（fail-open 監査）で確認済み。" data-source="fail-open-audit-2026-07-10" data-raised="2026-07-10">
        <span class="bid">BL-005</span>
        <span class="chips"><span class="chip imp">P1</span><span class="chip type">バグ</span></span>
        <span><span class="btitle">UTF-16/UTF-32 でエンコードされた変更ファイルがシークレットスキャナーをすり抜ける（Latin-1 バイトデコード + NUL 挿入による正規表現の取りこぼし）</span><span class="barea">secret-leak</span></span>

      <button type="button" class="bitem imp-P1" data-impact="P1" data-status="candidate" data-title="末尾に最終改行を持たないフロントマターのみのレコードが実体ゲートを通過する（空レコードの抜け穴が再発する）" data-impact-label="P1" data-type-label="バグ" data-status-label="候補" data-area="spec-before-impl" data-loc="scripts/guardrails/check-spec-before-impl.ps1:66" data-tags="fail-open,cwe-636" data-issue="" data-detail="Test-RecordHasSubstance は正規表現 '(?s)^\s*---\r?\n.*?\r?\n---\r?\n'（line 66）で YAML フロントマターを除去するが、この正規表現は閉じの '---' の後に改行があることを必須としている。レコードファイルの閉じの '---' が末尾改行なしで EOF に位置する場合、正規表現はマッチせず、フロントマターは除去されない。その結果 title/date/tags のメタデータが $bodyLines に残存し、その非空白文字数が MinRecordChars（40）を超えるため、実体のある本文がゼロであるにもかかわらず、ファイルは SubstantiveRecordChange として分類される。これはまさに、この関数が塞ぐために存在している「空の連番ファイルを追加してゲートを通過させる」抜け穴そのものである。したがって、メタデータのスタブのみの changelog ファイルを伴うだけのコード変更でもゲートを満たしてしまい、exit 0 で終了する。" data-proposal="閉じのフロントマター区切りが EOF を許容するようにする。例えば '(?s)^\s*---\r?\n.*?\r?\n---\s*(\r?\n|$)' とするか、除去前に改行を追記して正規化する。また、末尾改行の有無にかかわらず、長さチェックの前にフロントマターを除去することも検討する。" data-evidence="3 名の懐疑者による敵対的検証（フェイルオープン監査）で確認済み。" data-source="fail-open-audit-2026-07-10" data-raised="2026-07-10">

      </button>
      <button type="button" class="bitem imp-P2" data-impact="P2" data-status="accepted" data-title="`requiredDeny` が `wget-upload`(および `hard-reset`/`clean-force`/`branch-force-delete`/`rm-rf-home`/`wrapper-gist-share`)を含んでいないため、名前付きの持ち出し/破壊系の deny ルールを削除してもゲートを通過してしまう" data-impact-label="P2" data-type-label="バグ" data-status-label="採用" data-area="agent-policy" data-loc="scripts/guardrails/check-agent-policy.ps1:25" data-tags="fail-open,cwe-636,security" data-issue="PR #110" data-detail="ゲートが要求として固執するのは `$requiredDeny = @(&quot;force-push&quot;,&quot;rm-rf-root&quot;,&quot;gh-gist-share&quot;,&quot;curl-upload&quot;)` の集合だけである(25行目、48〜52行目)。SEC-01 のルール本文は 'request-body uploads via curl/wget'(curl/wget 経由のリクエストボディのアップロード)を拒否対象のチャネルとして明示的に名指ししているが、`wget-upload` は requiredDeny に含まれていない。53〜55行目のルールごとのループは、残っている deny ルールに `reason` があるかを確認するだけで、wget ルールが依然として存在するかは一切確認しない。そのため wget-upload の deny エントリを削除しても(`wget --post-data`/`--post-file` による持ち出しを再び開いてしまう)、denyIds には必要な4つの id がすべて残ったままとなり、問題は一つも追加されず、さらに settings.json が弱体化されたポリシーから一貫して再生成されるため -Verify の同期チェックも通過してしまう。" data-proposal="ルールが名指ししている持ち出し/破壊系の id を requiredDeny に追加する(最低でも SEC-01 の 'curl/wget' に合わせて `wget-upload` を、理想的には GOV-03 のための破壊系の完全な集合を)。あるいは、手作業で維持する部分集合ではなく、ポリシー自身のカテゴリ分けされたルールから必要な集合を導出する。" data-evidence="3名の懐疑役による敵対的検証(fail-open 監査)で確認済み。" data-source="fail-open-audit-2026-07-10" data-raised="2026-07-10">

      <button type="button" class="bitem imp-P2" data-impact="P2" data-status="candidate" data-title="二言語ペアチェックが相対パスを大文字小文字を区別せずに比較するため、大文字小文字だけが異なる／未翻訳のドキュメントが、大文字小文字を区別するファイルシステム上で通過してしまう" data-impact-label="P2" data-type-label="バグ" data-status-label="候補" data-area="bilingual-doc-pairs" data-loc="scripts/guardrails/check-bilingual-doc-pairs.ps1:34" data-tags="fail-open,cwe-636" data-issue="" data-detail="このルール（レジストリ DOC-01）は「docs/en と docs/ja は同一の相対 Markdown パス集合を保持する」ことを保証している。パス集合は Compare-Object（line 34）で比較され、Sort-Object -Unique（line 24）で重複除去されるが、PowerShell ではいずれもデフォルトで大文字小文字を区別しない（-CaseSensitive の指定がない）。この Linux／大文字小文字を区別するファイルシステムでは、README.md と readme.md は真に別個の相対パスであるにもかかわらず、ゲートはこれらを同一として扱う。これにより 2 つの障害モードが生じる。(a) en/README.md 対 ja/readme.md — 2 つのツリーは異なるパス集合を保持しているのに、ゲートはそれらを等しいと判定する。(b) さらに悪いことに、Sort-Object -Unique は別個の 2 つの en ファイル（Setup.md と setup.md）を 1 つのエントリに畳み込んでしまうため、日本語版がまったく存在しない英語ドキュメントが一切報告されない。いずれの場合も、ゲートが強制すると称する性質（同一のパス集合）が偽であるにもかかわらず、ゲートは exit 0 で終了する。" data-proposal="Compare-Object に -CaseSensitive を渡し、大文字小文字を区別して重複除去する（例：Sort-Object -Unique -CaseSensitive）ことで、大文字小文字だけが異なる相対パスを、対象ファイルシステム上で実際にそうであるように別個のパスとして扱う。" data-evidence="3 人の懐疑者による敵対的検証（フェイルオープン監査）で確認済み。" data-source="fail-open-audit-2026-07-10" data-raised="2026-07-10">

      <button type="button" class="bitem imp-P2" data-impact="P2" data-status="candidate" data-title="コンポーネントチェックのカバレッジがリテラルな type &quot;backend&quot; に紐づいており、カバレッジのアサーションが存在しない。そのため、あるコンポーネントの type を付け替えると、そのチェックが無言のうちに無効化される一方で、スイートはグリーンのまま維持される。" data-impact-label="P2" data-type-label="バグ" data-status-label="候補" data-area="component-checks" data-loc="scripts/guardrails/check-component-checks.ps1:133" data-tags="fail-open,cwe-636" data-issue="" data-detail="check.ps1 が実際に配線しているコンポーネントチェックの呼び出しは、ちょうど一つだけである。Invoke-Guardrail -Id backend-checks -Parameters @{ ComponentType = @(&quot;backend&quot;) }。check-component-checks.ps1:129-136 は $contract.components を、その .type が $ComponentType に含まれるものだけに絞り込む。絞り込んだ集合が空であれば &quot;No declared components in scope; nothing to run.&quot; を出力して exit 0 する。宣言されている唯一のコンポーネント (api, apps/api) が `uv run ruff check &amp;&amp; uv run pytest` を実行するのは、その type が文字列 &quot;backend&quot; であるという理由だけによる。実在する commands.check を持つ宣言済みコンポーネントが、配線されたいずれかの呼び出しによって実際に実行されることを保証するアサーションは、どのゲートにも存在しない。したがって api の type を &quot;backend&quot; から、contract ゲートが受理する他の任意の値 (worker/library/tooling/other/frontend — check-component-contract.ps1:143) に変更すると、それは唯一のランナーのスコープから外れる。ゲートはゼロ個のコンポーネントを反復して exit 0 する。api の lint/テストは一切実行されないにもかかわらず、backend-checks は成功を報告する。" data-proposal="type 文字列を信頼するのではなく、カバレッジをアサートすること。絞り込みの後に、空でない commands.check を持つすべての宣言済みコンポーネントが、配線されたいずれか一つの ComponentType 呼び出しによってちょうど一度だけ請け負われていることを検証し、type にアクティブなランナーが存在しないコンポーネントがあれば (無言の exit 0 ではなく) フェイルクローズさせる。あるいは同等に、呼び出しの集合をハードコードされた @(&quot;backend&quot;) からではなく、宣言済みのコンポーネント type から駆動する。" data-evidence="3人の懐疑者による敵対的検証 (フェイルオープン監査) で確認済み。" data-source="fail-open-audit-2026-07-10" data-raised="2026-07-10">

      <button type="button" class="bitem imp-P2" data-impact="P2" data-status="candidate" data-title="大文字小文字を区別しない重複排除とメンバーシップ判定により、名前が宣言済みのディレクトリにケースフォールドする未宣言のコンポーネントディレクトリがすり抜ける（Linux でのフェイルオープン）" data-impact-label="P2" data-type-label="バグ" data-status-label="候補" data-area="component-contract" data-loc="scripts/guardrails/check-component-contract.ps1:168" data-tags="fail-open,cwe-636" data-issue="" data-detail="このゲートは、apps/packages/services 配下のトップレベルディレクトリを検出し、それぞれが宣言済みのコンポーネントパスに含まれることを要求することでルールを強制する。大文字小文字を区別しない2つの操作が、大文字小文字を区別するファイルシステム（Linux の CI/ホスト）でこれを無効化する。(1) Get-DiscoveredComponents は `@($paths | Sort-Object -Unique)` を返す（64行目）が、Sort-Object -Unique は大文字小文字を区別しない。そのため、本来別物である2つのディレクトリ `apps/api` と `apps/apI` が単一の検出エントリに統合され、実在する製品ディレクトリの一方が対象リストから静かに消える（検証済み: DiscoveredComponents は [&quot;apps/apI&quot;] のみを返し、apps/api は脱落した）。(2) 強制のためのクロスチェック `if ($declared -notcontains $path)`（168行目）も大文字小文字を区別しないため、残ったエントリ `apps/apI` は宣言済みの `apps/api` にケースフォールドすることから、すでに宣言済みとして扱われる。結果として、stack/check 契約を持たない未宣言の実装コンポーネントディレクトリが、Problems:[] かつ exit 0 で通過する。（166行目の宣言側の `Sort-Object -Unique` も同じく大文字小文字を区別しない。）" data-proposal="検出と包含チェックを大文字小文字を区別するようにする: 64行目と166行目で `Sort-Object -Unique -CaseSensitive` を使い、168行目の大文字小文字を区別しない `-notcontains` を、序数的／大文字小文字を区別するメンバーシップ判定（例: `-ccontains`/`-cnotcontains` または明示的な [StringComparison]::Ordinal 比較）に置き換える。大文字小文字を区別するリポジトリファイルシステムに対するパス比較では、ケースを畳み込むべきではない。" data-evidence="3名の懐疑者による敵対的検証（フェイルオープン監査）で確認済み。" data-source="fail-open-audit-2026-07-10" data-raised="2026-07-10">

      <button type="button" class="bitem imp-P2" data-impact="P2" data-status="candidate" data-title="docs 配下の隠し markdown ファイルおよびドットディレクトリ内のファイルが列挙されず、配置を誤ったドキュメントが language-root ゲートをすり抜ける" data-impact-label="P2" data-type-label="バグ" data-status-label="候補" data-area="doc-language-roots" data-loc="scripts/guardrails/check-doc-language-roots.ps1:30" data-tags="fail-open,cwe-636" data-issue="" data-detail="Get-MarkdownPaths は `Get-ChildItem -LiteralPath $rootPath -Recurse -File -Include *.md,*.mdx` を `-Force` なしで使用している。この Linux/PowerShell では Get-ChildItem は既定で隠しアイテムを除外し、Unix では '.' で始まる名前はすべて隠し扱いとなる。そのため、名前が '.' で始まる markdown ファイル(例: docs/.rogue.md)や、ドットディレクトリ内の .md(例: docs/.drafts/rogue.md、docs/.vitepress/x.md)は一切返されない。$allMarkdown、$legacy、$unauthorized はいずれもこのリストから算出されるため、そうしたファイルは分類もフラグ付けもされない。すなわちゲートは 'Legacy Markdown files ... : 0' と出力して 0 で終了する一方で、'All Markdown lives under a configured language root' というルールに違反する Markdown ファイルが docs/en と docs/ja の外に未検査のまま存在することになる。ゲートが検査対象と称するもの('all Markdown under docs')は、気づかれないうちに不完全になっている。(隣接するすべてのドキュメント guardrail が同じ -Force なしのパターンを共有しているため、同じファイルは命名・ペアリング・言語コンテンツのチェックからもすり抜ける。)" data-proposal="Get-ChildItem の列挙(30 行目、および対応する隣接 guardrail)に -Force を追加し、隠しファイルとドットディレクトリ内のファイルを含めるようにする。あわせて、ドットディレクトリを走査対象とするか、それとも意図的に除外するかを、気づかれないまま取りこぼすのではなく明示的に決定する。" data-evidence="3-skeptic の敵対的検証(fail-open 監査)により確認済み。" data-source="fail-open-audit-2026-07-10" data-raised="2026-07-10">

      <button type="button" class="bitem imp-P2" data-impact="P2" data-status="candidate" data-title="secret-scan と spec-before-implementation は push イベントでは空の変更セットを黙って検査してしまう（GITHUB_BASE_REF を設定するのは PR のみ）ため、main への直接 push はスキャンされない" data-impact-label="P2" data-type-label="バグ" data-status-label="候補" data-area="secret-leak" data-loc="scripts/guardrails/check-secret-leak.ps1:49" data-tags="fail-open,cwe-636,security" data-issue="" data-detail="どちらの self-diffing ゲートも、検査対象を $env:GITHUB_BASE_REF から決定している。設定されている場合は origin/&lt;base&gt;...HEAD の差分を取り（check-secret-leak.ps1:49-59, check-spec-before-impl.ps1:81-94）、未設定の場合は WORKING-TREE 差分 — git diff / git diff --cached（spec では加えて ls-files --others）— にフォールバックする（check-secret-leak.ps1:60-66, check-spec-before-impl.ps1:95-108）。GITHUB_BASE_REF は pull_request でのみ設定される GitHub Actions 変数であり、push イベントでは空になる。CI の `check` ジョブは pull_request と push:branches:[main] の両方で起動され（.github/workflows/ci.yml:3-7,30-34）、注入するのは GUARDRAIL_PULL_REQUEST_BODY のみで（ci.yml:33）、base ref は一切渡さない。push 起動の実行ではチェックアウトされるのは push されたコミットそのもので working tree はクリーンなため、フォールバックの差分は空になる。結果として、main への push では両ゲートとも 0 ファイルをスキャンし（PR 本文も '' である）、成功を表示して exit 0 で終了する — コミットの実際の内容について何も強制していない。PR 経路では引き続き正しく強制される（base ref が設定される）ため、露出するのは gated PR 以外の経路で main に到達するあらゆる変更である（例えば直接 push であり、これは on:push トリガーが明示的に招き入れている）。" data-proposal="push イベントではクリーンな working tree に依存せず、実際のイベントから差分の base を導出する。GITHUB_BASE_REF は未設定だが CI で実行されている場合は github.event.before...github.event.after（または HEAD~1...HEAD / origin/main...HEAD）で差分を取るか、あるいは human-review-artifact ジョブが既に行っているように（git diff base.sha...head.sha）ci.yml からこれらのゲートに明示的な base を渡す。少なくとも、解決可能な base がないまま CI で実行される場合は、空のツリーを黙ってスキャンするのではなく fail closed にする（または明示的に skip する）。" data-evidence="3-skeptic の敵対的検証（fail-open 監査）により確認済み。" data-source="fail-open-audit-2026-07-10" data-raised="2026-07-10">

    <aside class="detail" id="md" aria-live="polite" data-labels="{&quot;impact&quot;:&quot;影響度&quot;,&quot;type&quot;:&quot;種別&quot;,&quot;status&quot;:&quot;状態&quot;,&quot;area&quot;:&quot;領域&quot;,&quot;where&quot;:&quot;場所&quot;,&quot;issue&quot;:&quot;Issue&quot;,&quot;tags&quot;:&quot;タグ&quot;,&quot;detail&quot;:&quot;機序&quot;,&quot;proposal&quot;:&quot;対応方針&quot;,&quot;evidence&quot;:&quot;根拠&quot;,&quot;source&quot;:&quot;出所&quot;}">

  <script>
    (function () {
      var items = Array.prototype.slice.call(document.querySelectorAll('.bitem'));
      var md = document.getElementById('md');
      var wide = window.matchMedia('(min-width:1001px)');
      var L = md ? JSON.parse(md.getAttribute('data-labels')) : {};
      function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
      function row(dt, dd, mono){ return '<dt>'+esc(dt)+'</dt><dd'+(mono?' class="mono"':'')+'>'+esc(dd)+'</dd>'; }
      function open(el){
        var g=el.getAttribute.bind(el);
        var tags=(g('data-tags')||'').split(',').filter(Boolean).map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('');
        var h='<dl>';
        h+='<p class="dh">'+esc(g('data-title'))+'</p>';
        h+=row(L.impact, g('data-impact-label'));
        h+=row(L.type, g('data-type-label'));
        h+=row(L.status, g('data-status-label'));
        h+=row(L.area, g('data-area'), true);
        h+=row(L.where, g('data-loc'), true);
        if(g('data-issue')) h+=row(L.issue, g('data-issue'));
        h+='<dt>'+esc(L.tags)+'</dt><dd><div class="tagrow">'+tags+'</div></dd>';
        h+=row(L.detail, g('data-detail'));
        h+=row(L.proposal, g('data-proposal'));
        h+=row(L.evidence, g('data-evidence'));
        h+=row(L.source, g('data-source')+' · '+g('data-raised'), true);
        h+='</dl>';
        md.innerHTML=h;
        items.forEach(function(x){ x.classList.remove('active'); });
        el.classList.add('active');
      }
      items.forEach(function(el){ el.addEventListener('click', function(){ open(el); }); });
      var pills = Array.prototype.slice.call(document.querySelectorAll('.pill'));
      pills.forEach(function(p){
        p.addEventListener('click', function(){
          pills.forEach(function(x){ x.setAttribute('aria-pressed','false'); });
          p.setAttribute('aria-pressed','true');
          var f=p.getAttribute('data-f');
          items.forEach(function(el){
            var show = f==='all' || el.getAttribute('data-impact')===f || el.getAttribute('data-status')===f;
            el.classList.toggle('is-hidden', !show);
          });
          var firstVisible=items.filter(function(el){return !el.classList.contains('is-hidden');})[0];
          if(wide.matches && firstVisible) open(firstVisible);
        });
      });
      if (wide.matches && items.length) open(items[0]);
    })();
  </script>
